# ============================
# Server
# ============================
server.port=8080

# ============================
# MySQL Datasource
# Update username/password/db name to match your local MySQL setup.
# Create the database first: CREATE DATABASE relay_db;
# ============================
spring.datasource.url=jdbc:mysql://localhost:3306/relay_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Ayush@25
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate
# update -> keeps schema in sync while you're actively developing.
# Switch to validate or none once the schema is stable, and use
# a migration tool (Flyway/Liquibase) for production-style setups.
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ============================
# Jackson
# ============================
spring.jackson.default-property-inclusion=non-null
spring.jackson.serialization.write-dates-as-timestamps=false

# ============================
# Relay engine settings
# ============================
relay.engine.worker.poll-interval-ms=1000
relay.engine.worker.thread-pool-size=4
relay.engine.run.default-max-steps=100
relay.engine.http.timeout-ms=5000
relay.engine.ai.timeout-ms=15000
relay.cli.enabled=true

# Webhook trigger security
relay.trigger.webhook.header-name=X-Relay-Signature

# AI provider (mock vs real) - "mock" lets you run without hitting a real API
relay.ai.provider=mock
relay.ai.api-key=CHANGE_ME
relay.ai.model=claude-sonnet-4-6

# ============================
# Logging
# ============================
logging.level.root=INFO
logging.level.com.relay=DEBUG
logging.level.org.hibernate.SQL=INFO
